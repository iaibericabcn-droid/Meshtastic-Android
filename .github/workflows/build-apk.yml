name: Build APK (fork)

# Standalone build for this fork. The upstream workflows (pull-request.yml,
# main-check.yml) are gated with `if: github.repository == 'meshtastic/Meshtastic-Android'`
# and never run here, so this workflow exists to produce a downloadable APK
# from the Actions tab on this repository.

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Always runs. No secrets required: fdroid flavor has no Google Maps / Google
  # dependency, and debug builds are signed with the shared checked-in
  # config/debug.keystore, so this succeeds on a completely clean fork.
  build-debug:
    name: Build F-Droid Debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build F-Droid debug APK
        run: ./gradlew androidApp:assembleFdroidDebug -Pci=true --parallel -Dorg.gradle.isolated-projects=false

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-fdroid-debug-apk
          path: androidApp/build/outputs/apk/fdroid/debug/*.apk
          retention-days: 14

  # Only runs once the KEYSTORE / KEYSTORE_FILENAME / KEYSTORE_PROPERTIES
  # secrets exist on this repo (Settings -> Secrets and variables -> Actions).
  # Same secret names/shape as upstream's release.yml, so a real release
  # keystore dropped in later "just works" here too.
  build-release:
    name: Build Signed F-Droid Release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    if: ${{ github.event_name == 'workflow_dispatch' && secrets.KEYSTORE_PROPERTIES != '' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Write signing config
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEYSTORE_FILENAME: ${{ secrets.KEYSTORE_FILENAME }}
          KEYSTORE_PROPERTIES: ${{ secrets.KEYSTORE_PROPERTIES }}
        run: |
          echo "$KEYSTORE" | base64 -d > "androidApp/$KEYSTORE_FILENAME"
          echo "$KEYSTORE_PROPERTIES" > keystore.properties

      - name: Build F-Droid release APK
        run: ./gradlew androidApp:assembleFdroidRelease -Pci=true --parallel -Dorg.gradle.isolated-projects=false

      - name: Remove signing material
        if: always()
        run: rm -f keystore.properties androidApp/*.jks

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: app-fdroid-release-apk
          path: androidApp/build/outputs/apk/fdroid/release/*.apk
          retention-days: 14
